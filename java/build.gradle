plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

// bj/ 문제들은 패키지 없이 전부 Main 클래스라 하나의 sourceSet으로 컴파일하면 충돌한다.
// pg/ 문제 풀이만 포맷/린트 대상으로 삼는다.
sourceSets {
    main {
        java {
            srcDirs = ['src/pg']
        }
    }
}

spotless {
    java {
        target 'src/pg/**/*.java'
        // aosp() = 4-space indent, 기존 저장소 코드 스타일과 맞춘다 (기본 googleJavaFormat은 2-space).
        googleJavaFormat().aosp()
    }
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

// SolutionTest는 입출력 예를 그대로 박아둔 로컬 확인용 파일이라 매직넘버 등이 잔뜩 잡힌다.
// 린트 대상은 실제 제출하는 Solution 코드로 한정한다.
tasks.withType(Checkstyle).configureEach {
    exclude '**/SolutionTest.java'
}

// 특정 문제의 main()을 터미널에서 실행한다.
// 예) ./gradlew runMain -PmainClass=pg.level1.p12977_make_prime.SolutionTest
tasks.register('runMain', JavaExec) {
    group = 'application'
    description = 'Runs a main() by fully qualified class name (-PmainClass=...)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = providers.gradleProperty('mainClass')
}
